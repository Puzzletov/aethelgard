name = "aethelgard"
main = "src/index.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://aethelgard-3j9.pages.dev"

[[ratelimits]]
name = "ANALYZE_RATE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[durable_objects.bindings]]
name = "TRUSTED_RUNTIME"
class_name = "TrustedRuntime"
script_name = "aethelgard-trusted-runtime"

[observability]
enabled = false
