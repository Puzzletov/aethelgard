name: Rotate Resend secret

on:
  push:
    branches:
      - chore/bootstrap-worker
    paths:
      - .github/workflows/rotate-resend-secret.yml

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Rotate, test, and store sending-only key
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          RESEND_BOOTSTRAP_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          set +x

          test -n "${RESEND_BOOTSTRAP_API_KEY}"
          readonly resend_api="https://api.resend.com"
          readonly user_agent="aethelgard-secret-rotation/1.0"

          key_list="$({
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${RESEND_BOOTSTRAP_API_KEY}" \
              --header "User-Agent: ${user_agent}" \
              "${resend_api}/api-keys?limit=2"
          })"
          key_count="$(jq -er '.data | length' <<<"${key_list}")"
          if [ "${key_count}" -ne 1 ]; then
            echo "::error::Expected exactly one existing Resend API key; no change was made."
            exit 1
          fi
          old_key_id="$(jq -er '.data[0].id' <<<"${key_list}")"

          new_key_response="$({
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${RESEND_BOOTSTRAP_API_KEY}" \
              --header "User-Agent: ${user_agent}" \
              --header "Content-Type: application/json" \
              --data '{"name":"aethelgard-production-send","permission":"sending_access"}' \
              "${resend_api}/api-keys"
          })"
          new_key_id="$(jq -r '.id // empty' <<<"${new_key_response}")"

          cleanup_unstored_key() {
            exit_code=$?
            if [ "${exit_code}" -ne 0 ] && [ -n "${new_key_id:-}" ]; then
              curl --silent --show-error \
                --request DELETE \
                --header "Authorization: Bearer ${RESEND_BOOTSTRAP_API_KEY}" \
                --header "User-Agent: ${user_agent}" \
                "${resend_api}/api-keys/${new_key_id}" >/dev/null || true
            fi
            exit "${exit_code}"
          }
          trap cleanup_unstored_key EXIT

          test -n "${new_key_id}"
          new_key_token="$(jq -er '.token' <<<"${new_key_response}")"
          test -n "${new_key_token}"
          echo "::add-mask::${new_key_token}"

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${new_key_token}" \
            --header "User-Agent: ${user_agent}" \
            --header "Content-Type: application/json" \
            --header "Idempotency-Key: aethelgard-resend-key-rotation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --data '{"from":"Aethelgard <onboarding@resend.dev>","to":["delivered@resend.dev"],"subject":"Aethelgard Resend key validation","text":"Sending-only Resend key validation."}' \
            "${resend_api}/emails" >/dev/null

          printf '%s' "${new_key_token}" | gcloud secrets versions add RESEND_API_KEY \
            --project="${GCP_PROJECT_ID}" \
            --data-file=- \
            --quiet >/dev/null

          trap - EXIT
          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer ${RESEND_BOOTSTRAP_API_KEY}" \
            --header "User-Agent: ${user_agent}" \
            "${resend_api}/api-keys/${old_key_id}" >/dev/null

          unset key_list new_key_response new_key_token RESEND_BOOTSTRAP_API_KEY
          echo "Resend sending-only key rotated, tested, stored, and old key revoked."
