name: Migrate AI provider secrets

on:
  push:
    branches:
      - chore/bootstrap-worker
    paths:
      - .github/workflows/migrate-ai-provider-secrets.yml

permissions:
  contents: read
  id-token: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Add secret versions
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "${GROQ_API_KEY}"
          test -n "${OPENROUTER_API_KEY}"
          printf '%s' "${GROQ_API_KEY}" | gcloud secrets versions add GROQ_API_KEY \
            --project="${GCP_PROJECT_ID}" \
            --data-file=- \
            --quiet >/dev/null
          printf '%s' "${OPENROUTER_API_KEY}" | gcloud secrets versions add OPENROUTER_API_KEY \
            --project="${GCP_PROJECT_ID}" \
            --data-file=- \
            --quiet >/dev/null
          echo "AI provider secret versions migrated."
