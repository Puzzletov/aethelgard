name = "aethelgard-trusted-runtime"
main = "src/index.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[observability]
enabled = false

[vars]
TURNSTILE_EXPECTED_ACTION = "analyze"
TURNSTILE_EXPECTED_HOSTNAME = "aethelgard.pages.dev"

[secrets]
required = ["TURNSTILE_SECRET"]

[exports.TrustedRuntime]
type = "durable-object"
storage = "sqlite"
